<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#030712"/><stop offset=".55" stop-color="#071525"/><stop offset="1" stop-color="#10051d"/>
 </linearGradient>
 <linearGradient id="neon" x1="0" x2="1"><stop stop-color="#00e5ff"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#00ff9d"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#19304a" stroke-width="1"/></pattern>
 <style>
   .pulse { animation:pulse 2.5s ease-in-out infinite; transform-origin:center; }
   .float { animation:float 4s ease-in-out infinite; }
   @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
   @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
 </style>
</defs>
<rect width="1600" height="500" rx="24" fill="url(#bg)"/>
<rect width="1600" height="500" rx="24" fill="url(#grid)" opacity=".7"/>
<rect x="18" y="18" width="1564" height="464" rx="20" fill="none" stroke="url(#neon)" stroke-width="2"/>

